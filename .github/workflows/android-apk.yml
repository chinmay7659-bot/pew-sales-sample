name: Build Direct Android APK

on:
  workflow_dispatch:
    inputs:
      sheets_bridge_url:
        description: 'Optional: Google Sheet Sync URL (https://script.google.com/.../exec) to pre-bake into APK'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android Gradle project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SHEETS_BRIDGE_URL: ${{ inputs.sheets_bridge_url || vars.EXPO_PUBLIC_SHEETS_BRIDGE_URL }}
          EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID: ${{ vars.EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone installable Android APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SHEETS_BRIDGE_URL: ${{ inputs.sheets_bridge_url || vars.EXPO_PUBLIC_SHEETS_BRIDGE_URL }}
          EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID: ${{ vars.EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: ./gradlew assembleRelease

      - name: Rename APK to pew-sales-sample.apk
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/android/app/build/outputs/apk/release/pew-sales-sample.apk

      - name: Upload pew-sales-sample.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: pew-sales-sample-apk
          path: mobile/android/app/build/outputs/apk/release/pew-sales-sample.apk
          if-no-files-found: error
