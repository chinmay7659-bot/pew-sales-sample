name: Build Direct Android APK

on:
  workflow_dispatch:
    inputs:
      sheets_bridge_url:
        description: 'Optional: Google Sheet Sync URL (https://script.google.com/.../exec) to pre-bake into APK'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cli-tools.zip
            unzip -q /tmp/cli-tools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f /tmp/cli-tools.zip
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Install Expo dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android Gradle project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SHEETS_BRIDGE_URL: ${{ inputs.sheets_bridge_url || vars.EXPO_PUBLIC_SHEETS_BRIDGE_URL }}
          EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID: ${{ vars.EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone installable Android APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SHEETS_BRIDGE_URL: ${{ inputs.sheets_bridge_url || vars.EXPO_PUBLIC_SHEETS_BRIDGE_URL }}
          EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID: ${{ vars.EXPO_PUBLIC_DEFAULT_SPREADSHEET_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: ./gradlew assembleRelease

      - name: Rename APK to pew-sales-sample.apk
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/android/app/build/outputs/apk/release/pew-sales-sample.apk

      - name: Upload pew-sales-sample.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: pew-sales-sample-apk
          path: mobile/android/app/build/outputs/apk/release/pew-sales-sample.apk
          if-no-files-found: error
